# Tests run against a throwaway in-memory database and never seed demo data,
# so they neither depend on nor pollute the on-prem ./data directory.
spring.datasource.url=jdbc:h2:mem:storemate-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

storemate.seed-demo-data=false
storemate.jwt.secret=test-secret-key-at-least-32-bytes-long
storemate.jwt.expiration-minutes=60
