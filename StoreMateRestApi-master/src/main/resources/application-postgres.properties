# ===========================================================================
# PostgreSQL profile - for a real on-prem install.
#   java -jar app.jar --spring.profiles.active=postgres
# or set SPRING_PROFILES_ACTIVE=postgres (see docker-compose.yml).
# ===========================================================================

spring.datasource.url=${STOREMATE_DB_URL:jdbc:postgresql://localhost:5432/storemate}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${STOREMATE_DB_USER:storemate}
spring.datasource.password=${STOREMATE_DB_PASSWORD:storemate}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=false
