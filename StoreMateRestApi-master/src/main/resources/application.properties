# ===========================================================================
# StoreMate REST API - default (on-prem, zero-setup) configuration
#
# Defaults to a FILE-BACKED H2 database so a shop can run `java -jar app.jar`
# and keep its data across restarts. For a larger install run with
# `--spring.profiles.active=postgres` (see application-postgres.properties).
# ===========================================================================

spring.application.name=storemate

# --- Datasource: file-backed H2 -------------------------------------------
# STOREMATE_DATA_DIR lets an operator point the database at a backed-up volume.
storemate.data-dir=${STOREMATE_DATA_DIR:./data}
# AUTO_SERVER lets an operator attach a SQL client for backups while the API runs.
spring.datasource.url=jdbc:h2:file:${storemate.data-dir}/storemate;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${STOREMATE_DB_USER:sa}
spring.datasource.password=${STOREMATE_DB_PASSWORD:}

# --- H2 console -----------------------------------------------------------
# Off by default: an on-prem box should not expose a DB console on the LAN.
spring.h2.console.enabled=${STOREMATE_H2_CONSOLE:false}

# --- JPA / Hibernate ------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- Server ---------------------------------------------------------------
# 0.0.0.0 so tablets/phones on the shop LAN can reach it.
server.address=${STOREMATE_BIND_ADDRESS:0.0.0.0}
server.port=${STOREMATE_PORT:8080}

# --- Security -------------------------------------------------------------
# MUST be overridden in production. Minimum 32 characters (256-bit HS256 key).
storemate.jwt.secret=${STOREMATE_JWT_SECRET:change-me-please-32-characters-min}
# Token lifetime in minutes. Shop staff stay logged in for a full shift.
storemate.jwt.expiration-minutes=${STOREMATE_JWT_EXPIRATION_MINUTES:720}

# Seeds the demo/demo account with sample data on an empty database.
# Turn this OFF for a real shop deployment.
storemate.seed-demo-data=${STOREMATE_SEED_DEMO:true}

# --- Errors ---------------------------------------------------------------
server.error.include-message=always
server.error.include-stacktrace=never
